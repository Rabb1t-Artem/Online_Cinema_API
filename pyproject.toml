[project]
name = "src"
version = "0.1.0"
description = ""
authors = [
    {name = "Rabb1t-Artem", email = "79219648+Rabb1t-Artem@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all] (>=0.115.8,<0.116.0)",
    "sqlalchemy (>=2.0.37,<3.0.0)",
    "alembic (>=1.14.1,<2.0.0)", 
    "flake8 (>=7.1.1,<8.0.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "tqdm (>=4.67.1,<5.0.0)",
    "pandas (>=2.2.3,<3.0.0)",
    "pytest (>=8.3.4,<9.0.0)",
    "black (>=25.1.0,<26.0.0)",
    "pydantic-settings (>=2.7.1,<3.0.0)",
    "uvicorn (>=0.34.0,<0.35.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "pytest-env (>=1.1.5,<2.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "email-validator (>=2.2.0,<3.0.0)",
    "bcrypt (>=4.2.1,<5.0.0)",
    "jinja2 (>=3.1.5,<4.0.0)",
    "pytest-order (>=1.3.0,<2.0.0)",
    "beautifulsoup4 (>=4.12.3,<5.0.0)",
    "validators (>=0.34.0,<0.35.0)",
    "boto3 (>=1.36.11,<2.0.0)",
    "botocore (>=1.36.11,<2.0.0)",
    "pillow (>=11.1.0,<12.0.0)",
    "python-multipart (>=0.0.20,<0.0.21)",
    "mypy (>=1.14.1,<2.0.0)",
    "celery[redis] (>=5.4.0,<6.0.0)",
    "redis (>=5.2.1,<6.0.0)"
]

[tool.black]
line-length = 119

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false
check_untyped_defs = false
warn_return_any = false
warn_unused_ignores = true
warn_redundant_casts = true
exclude = "/(venv|tests|migrations|alembic)/"

[[tool.mypy.overrides]]
module = [
    "venv.*",
    "security.*",
    "exceptions.*", 
    "storages.*",
    "tests.*"
]
ignore_missing_imports = true
disallow_untyped_calls = false
disallow_untyped_defs = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
